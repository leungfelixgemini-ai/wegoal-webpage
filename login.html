<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeGoal - 登入 / 註冊</title>
  <link rel="icon" href="logo/logo_black_cut.jpeg" type="image/jpeg">
  <link rel="canonical" href="https://wegoal-hk.com/login.html">
  <meta name="robots" content="noindex, follow">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#020617', // Deep Navy
            surface: '#0f172a', // Slate 900
            primary: '#3b82f6', // Vibrant Blue
            text_primary: '#f8fafc',
            text_secondary: '#94a3b8',
            dark_bg: '#020617'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="i18n.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    
    .glow-primary-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-primary-hover:hover {
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
    }

    .bg-grid-pattern {
      background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 60%, transparent 100%);
    }

    .aurora-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(2, 6, 23, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.6); /* Slate 900 */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Input Autofill fix for dark mode */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active{
      -webkit-box-shadow: 0 0 0 30px #1E1E1E inset !important;
      -webkit-text-fill-color: white !important;
      transition: background-color 5000s ease-in-out 0s;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative overflow-x-hidden selection:bg-primary selection:text-black">

  <!-- Background Elements -->
  <div class="absolute inset-0 z-0 bg-grid-pattern opacity-30"></div>
  <div class="aurora-glow"></div>
  


  <!-- Back to Home -->
  <a href="index.html" class="absolute top-8 left-8 z-20 text-gray-400 hover:text-white flex items-center gap-2 transition-colors duration-300">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    <span data-i18n="login_back">返回首頁</span>
  </a>

  <!-- Auth Container -->
  <div class="relative z-10 w-full max-w-md px-6 py-12">
    
    <!-- Logo -->
    <div class="text-center mb-10 border-b border-slate-800/50 pb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <img src="logo/logo_black_cut.jpeg" alt="" class="h-12 w-auto rounded-xl shadow-[0_0_15px_rgba(0,0,0,0.5)]">
        <span class="text-3xl font-extrabold text-white tracking-tight">We<span class="text-primary">Goal</span></span>
      </a>
      <p data-i18n="login_subtitle" class="mt-3 text-text_secondary text-sm">Let's Go. We Goal!</p>
    </div>

    <!-- Glass Card -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl">
      <div id="auth-main">
      <!-- Tabs -->
      <div class="flex relative mb-8 bg-slate-900/40 rounded-lg p-1 border border-slate-800/50">
        <!-- Active Background Indicator -->
        <div id="tab-indicator" class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-surface rounded-md shadow-sm transition-all duration-300 ease-out border border-slate-700/50"></div>
        
        <button id="tab-login" onclick="switchTab('login')" data-i18n="login_tab_login" class="relative z-10 flex-1 py-2.5 text-sm font-semibold transition-colors duration-300 text-white">登入</button>
        <button id="tab-register" onclick="switchTab('register')" data-i18n="login_tab_register" class="relative z-10 flex-1 py-2.5 text-sm font-semibold transition-colors duration-300 text-gray-400 hover:text-white">註冊</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="space-y-5 animate-fade-in block">
        <div>
          <label data-i18n="login_email_label" class="block text-sm font-medium text-gray-300 mb-1.5">電子郵件</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
            </div>
            <input type="email" id="login-email" required placeholder="name@example.com" data-i18n="login_email_placeholder" class="block w-full pl-10 pr-3 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label data-i18n="login_pw_label" class="block text-sm font-medium text-gray-300">密碼</label>
            <a href="#" data-i18n="login_forgot_pw" class="text-xs text-primary hover:text-white transition-colors duration-200">忘記密碼？</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <input type="text" id="login-password" autocomplete="off" required placeholder="••••••••" data-i18n="login_pw_placeholder" class="block w-full pl-10 pr-12 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-white transition-colors duration-200" onclick="togglePasswordVis('login-password', 'eye-login')">
              <svg id="eye-login" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" data-i18n="login_btn" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-primary hover:-translate-y-0.5 focus:outline-none glow-primary-hover transition-all duration-300">
            登入
          </button>
        </div>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="space-y-5 animate-fade-in hidden">
        <div>
          <label data-i18n="login_reg_name_label" class="block text-sm font-medium text-gray-300 mb-1.5">使用者名稱</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
            </div>
            <input type="text" id="reg-name" required placeholder="你的名字" data-i18n="login_reg_name_placeholder" class="block w-full pl-10 pr-3 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
          </div>
        </div>

        <div>
          <label data-i18n="login_email_label" class="block text-sm font-medium text-gray-300 mb-1.5">電子郵件</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
                <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
              </div>
              <input type="email" id="reg-email" required placeholder="name@example.com" data-i18n="login_email_placeholder" class="block w-full pl-10 pr-3 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
            </div>
            <button type="button" id="btn-send-otp" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700/50 rounded-xl text-sm font-medium text-white transition-colors duration-300 whitespace-nowrap">
              發送驗證碼
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">驗證碼</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
            </div>
            <input type="text" id="reg-otp" required placeholder="6位數驗證碼" class="block w-full pl-10 pr-3 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
          </div>
        </div>

        <div>
          <label data-i18n="login_reg_pw_label" class="block text-sm font-medium text-gray-300 mb-1.5">設定密碼</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <input type="text" id="reg-password" autocomplete="off" required placeholder="至少 8 個字元" data-i18n="login_reg_pw_placeholder" class="block w-full pl-10 pr-12 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-white transition-colors duration-200" onclick="togglePasswordVis('reg-password', 'eye-1')">
              <svg id="eye-1" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>
        </div>

        <div>
          <label data-i18n="login_reg_confirm_label" class="block text-sm font-medium text-gray-300 mb-1.5">確定密碼</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <input type="text" id="reg-confirm-password" autocomplete="off" required placeholder="再次輸入密碼" data-i18n="login_reg_confirm_placeholder" class="block w-full pl-10 pr-12 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
            <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-white transition-colors duration-200" onclick="togglePasswordVis('reg-confirm-password', 'eye-2')">
              <svg id="eye-2" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
          </div>
          <p id="password-error" data-i18n="login_reg_error" class="hidden text-red-500 text-xs mt-1.5 ml-1">密碼不一致，請重新輸入</p>
        </div>

        <div class="pt-2">
          <button type="submit" data-i18n="login_reg_btn" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-primary hover:-translate-y-0.5 focus:outline-none glow-primary-hover transition-all duration-300">
            建立帳號
          </button>
        </div>
      </form>

      <!-- Divider -->
      <div class="mt-8 relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-700/50"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span data-i18n="login_or" class="px-3 bg-surface text-gray-400 glass-card mx-auto inline-block rounded-full px-4 border-none !bg-[#1e1e1eba]">
            或者使用以下方式
          </span>
        </div>
      </div>

      <!-- Social Auth -->
      <div class="mt-6 space-y-3">
        <button type="button" class="w-full flex items-center justify-center gap-2 px-4 py-3 border border-slate-700/50 rounded-xl shadow-sm bg-slate-900/40 hover:bg-slate-800 text-sm font-medium text-white transition-colors duration-300">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          <span id="google-auth-label" data-i18n="login_google">使用 Google 登入</span>
        </button>
        <button type="button" onclick="openPhoneEntry()" class="w-full flex items-center justify-center gap-2 px-4 py-3 border border-slate-700/50 rounded-xl shadow-sm bg-slate-900/40 hover:bg-slate-800 text-sm font-medium text-white transition-colors duration-300">
          <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
          <span id="phone-auth-label" data-i18n="login_phone">使用電話登入</span>
        </button>
        <button type="button" class="hidden" aria-hidden="true" tabindex="-1">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.56-1.702z"/></svg>
          Apple
        </button>
      </div>
      </div>

      <!-- Phone login -->
      <div id="phone-login-view" class="hidden">
        <button type="button" onclick="showAuthMain()" class="mb-6 text-gray-400 hover:text-white flex items-center gap-2 text-sm transition-colors duration-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          <span data-i18n="login_phone_back">返回</span>
        </button>
        <h2 data-i18n="login_phone_title" class="text-xl font-bold text-white">使用電話登入</h2>
        <p data-i18n="login_phone_hint" class="mt-2 mb-6 text-sm text-text_secondary">輸入電話號碼與密碼即可登入，登入時不需要簡訊驗證碼。</p>
        <form id="form-phone-login" class="space-y-5">
          <div>
            <label data-i18n="login_phone_label" class="block text-sm font-medium text-gray-300 mb-1.5">電話號碼</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">
                <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
              </div>
              <input type="tel" id="phone-login-number" required inputmode="tel" autocomplete="tel" placeholder="+852 9123 4567" data-i18n="login_phone_placeholder" class="block w-full pl-10 pr-3 py-3 bg-slate-900/50 border border-slate-700/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-all duration-300">
            </div>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label data-i18n="login_pw_label" class="block text-sm font-medium text-gray-300">密碼</label>
              <button type="button" onclick="openPhoneReset()" data-i18n="login_forgot_pw" class="text-xs text-primary hover:text-white transition-colors duration-200">忘記密碼？</button>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pt-px pointer-events-none">

  <script>
    // Simple tab switching logic
    let currentAuthTab = 'login';

    function setLabeledText(el, key) {
      if (!el) return;
      el.setAttribute('data-i18n', key);
      const dict = (typeof I18N !== 'undefined' && I18N.dictionaries[I18N.currentLang]) || {};
      if (dict[key]) el.textContent = dict[key];
    }

    function setGoogleLabel(tabId) {
      const key = tabId === 'register' ? 'login_google_register' : 'login_google';
      setLabeledText(document.getElementById('google-auth-label'), key);
    }

    function setPhoneLabel(tabId) {
      const key = tabId === 'register' ? 'login_phone_register' : 'login_phone';
      setLabeledText(document.getElementById('phone-auth-label'), key);
    }

    function showAuthMain() {
      document.getElementById('auth-main').classList.remove('hidden');
      document.getElementById('phone-login-view').classList.add('hidden');
      document.getElementById('phone-register-view').classList.add('hidden');
      document.getElementById('phone-reset-view').classList.add('hidden');
    }

    function openPhoneEntry() {
      if (currentAuthTab === 'register') openPhoneRegister();
      else openPhoneLogin();
    }

    function openPhoneLogin() {
      document.getElementById('auth-main').classList.add('hidden');
      document.getElementById('phone-register-view').classList.add('hidden');
      document.getElementById('phone-reset-view').classList.add('hidden');
      document.getElementById('phone-login-view').classList.remove('hidden');
    }

    function openPhoneRegister() {
      document.getElementById('auth-main').classList.add('hidden');
      document.getElementById('phone-login-view').classList.add('hidden');
      document.getElementById('phone-reset-view').classList.add('hidden');
      document.getElementById('phone-register-view').classList.remove('hidden');
    }

    function openPhoneReset() {
      const phone = document.getElementById('phone-login-number').value;
      if (phone) document.getElementById('phone-reset-number').value = phone;
      document.getElementById('auth-main').classList.add('hidden');
      document.getElementById('phone-login-view').classList.add('hidden');
      document.getElementById('phone-register-view').classList.add('hidden');
      document.getElementById('phone-reset-view').classList.remove('hidden');
    }

    function tr(key) {
      const dict = (typeof I18N !== 'undefined' && I18N.dictionaries[I18N.currentLang]) || {};
      return dict[key] || key;
    }

    function normalizePhone(value) {
      return String(value || '').replace(/[\s-]/g, '');
    }

    function switchTab(tabId) {
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');
      const btnLogin = document.getElementById('tab-login');
      const btnRegister = document.getElementById('tab-register');
      const indicator = document.getElementById('tab-indicator');
      currentAuthTab = tabId;
      showAuthMain();
      setGoogleLabel(tabId);
      setPhoneLabel(tabId);
      
      if (tabId === 'login') {
        // Show Login
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        
        // Update styling
        indicator.style.transform = 'translateX(0)';
        btnLogin.classList.add('text-white');
        btnLogin.classList.remove('text-gray-400');
        btnRegister.classList.add('text-gray-400');
        btnRegister.classList.remove('text-white');
      } else {
        // Show Register
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        
        // Update styling
        indicator.style.transform = 'translateX(100%)';
        btnRegister.classList.add('text-white');
        btnRegister.classList.remove('text-gray-400');
        btnLogin.classList.add('text-gray-400');
        btnLogin.classList.remove('text-white');
      }
    }

    // Check URL parameters for starting tab
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if(urlParams.get('tab') === 'register') {
        switchTab('register');
      }
    }
    const masks = {};
    const timers = {};
    const visibility = { 'reg-password': false, 'reg-confirm-password': false, 'login-password': false, 'phone-password': false, 'phone-new-password': false, 'phone-confirm-password': false, 'phone-reg-password': false, 'phone-reg-confirm': false };
    
    function setupMasking(id) {
        const el = document.getElementById(id);
        masks[id] = "";
        
        el.addEventListener('input', function(e) {
            const val = el.value;
            if (val.length > masks[id].length) {
                const newChar = val.charAt(val.length - 1);
                masks[id] += newChar;
            } else if (val.length < masks[id].length) {
                masks[id] = masks[id].substring(0, val.length);
            }
            
            if (!visibility[id]) {
                const len = masks[id].length;
                if (len > 0) {
                    el.value = '•'.repeat(len - 1) + masks[id].charAt(len - 1);
                    clearTimeout(timers[id]);
                    timers[id] = setTimeout(() => {
                        if (!visibility[id]) el.value = '•'.repeat(len);
                    }, 3000);
                }
            } else {
                el.value = masks[id];
            }
            
            if (id === 'reg-confirm-password' || id === 'reg-password') {
                checkMatch();
            }
            if (id === 'phone-new-password' || id === 'phone-confirm-password') {
                checkPhoneMatch();
            }
            if (id === 'phone-reg-password' || id === 'phone-reg-confirm') {
                checkPhoneRegMatch();
            }
        });
    }

    function togglePasswordVis(id, eyeId) {
        visibility[id] = !visibility[id];
        const el = document.getElementById(id);
        const eye = document.getElementById(eyeId);
        if (visibility[id]) {
            el.value = masks[id];
            eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
        } else {
            el.value = '•'.repeat(masks[id].length);
            eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
        }
    }

    function checkMatch() {
        const p1 = masks['reg-password'] || "";
        const p2 = masks['reg-confirm-password'] || "";
        const errorMsg = document.getElementById('password-error');
        const confirmEl = document.getElementById('reg-confirm-password');
        
        if (p2.length > 0 && p1 !== p2) {
            errorMsg.classList.remove('hidden');
            confirmEl.classList.remove('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return false;
        } else {
            errorMsg.classList.add('hidden');
            confirmEl.classList.add('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return true;
        }
    }

    function checkPhoneMatch() {
        const p1 = masks['phone-new-password'] || "";
        const p2 = masks['phone-confirm-password'] || "";
        const errorMsg = document.getElementById('phone-password-error');
        const confirmEl = document.getElementById('phone-confirm-password');

        if (p2.length > 0 && p1 !== p2) {
            errorMsg.classList.remove('hidden');
            confirmEl.classList.remove('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return false;
        } else {
            errorMsg.classList.add('hidden');
            confirmEl.classList.add('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return true;
        }
    }

    setupMasking('login-password');
    setupMasking('reg-password');
    setupMasking('reg-confirm-password');
    function checkPhoneRegMatch() {
        const p1 = masks['phone-reg-password'] || "";
        const p2 = masks['phone-reg-confirm'] || "";
        const errorMsg = document.getElementById('phone-reg-password-error');
        const confirmEl = document.getElementById('phone-reg-confirm');

        if (p2.length > 0 && p1 !== p2) {
            errorMsg.classList.remove('hidden');
            confirmEl.classList.remove('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return false;
        } else {
            errorMsg.classList.add('hidden');
            confirmEl.classList.add('border-slate-700/50', 'focus:border-primary', 'focus:ring-primary');
            confirmEl.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            return true;
        }
    }

    setupMasking('phone-password');
    setupMasking('phone-new-password');
    setupMasking('phone-confirm-password');
    setupMasking('phone-reg-password');
    setupMasking('phone-reg-confirm');

    const API_BASE = "https://we-goal-server.vercel.app";

    // Toast Notification helper
    function showToast(message, isError = false) {
      let toast = document.getElementById('toast-notification');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast-notification';
        toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-lg text-sm font-medium transition-all duration-300 transform -translate-y-full opacity-0 pointer-events-none';
        document.body.appendChild(toast);
      }
      
      toast.textContent = message;
      toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 ${isError ? 'bg-red-500/90 text-white' : 'bg-green-500/90 text-white'} backdrop-blur-md`;
      
      setTimeout(() => {
        toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-lg text-sm font-medium transition-all duration-300 transform -translate-y-full opacity-0 ${isError ? 'bg-red-500/90 text-white' : 'bg-green-500/90 text-white'} backdrop-blur-md pointer-events-none`;
      }, 3000);
    }

    // Login API Integration
    document.getElementById('form-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const password = masks['login-password'];
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      
      submitBtn.innerText = '登入中...';
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.message || "登入失敗");
        
        // Save token and user info
        localStorage.setItem("token", data.token);
        if(data.user) {
          localStorage.setItem("user", JSON.stringify(data.user));
        }
        
        showToast("登入成功！");
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        
      } catch (err) {
        showToast(err.message, true);
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });

    // Send OTP API Integration
    document.getElementById('btn-send-otp').addEventListener('click', async function() {
      const email = document.getElementById('reg-email').value;
      if (!email) {
        showToast("請先輸入電子郵件", true);
        return;
      }
      
      const btn = this;
      const originalText = btn.innerText;
      btn.innerText = '發送中...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, type: "registration" })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.message || "驗證碼發送失敗");
        
        showToast("驗證碼已發送，請檢查您的信箱！");
        
        let count = 60;
        const timer = setInterval(() => {
          count--;
          btn.innerText = `${count}s 後重試`;
          if (count <= 0) {
            clearInterval(timer);
            btn.innerText = originalText;
            btn.disabled = false;
          }
        }, 1000);
        
      } catch (err) {
        showToast(err.message, true);
        btn.innerText = originalText;
        btn.disabled = false;
      }
    });

    // Register API Integration
    document.getElementById('form-register').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (!checkMatch() || masks['reg-password'] !== masks['reg-confirm-password']) {
        showToast("密碼不一致，請重新確認", true);
        return;
      }

      const email = document.getElementById('reg-email').value;
      const name = document.getElementById('reg-name').value;
      const password = masks['reg-password'];
      const otp = document.getElementById('reg-otp').value;
      
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      
      submitBtn.innerText = '註冊中...';
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, name, password, otp })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.message || "註冊失敗");
        
        showToast("註冊成功！請登入");
        switchTab('login');
        
      } catch (err) {
        showToast(err.message, true);
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });

    function phoneRejectedByEmailApi(data) {
      const emailErrors = data && data.errors && data.errors.email && data.errors.email._errors;
      if (emailErrors && emailErrors.length) return true;
      return !!(data && /invalid email/i.test(data.message || ""));
    }

    document.getElementById('form-phone-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      const phone = normalizePhone(document.getElementById('phone-login-number').value);
      const password = masks['phone-password'];
      if (!phone) {
        showToast(tr('login_phone_need_number'), true);
        return;
      }

      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = tr('login_phone_logging_in');
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(phoneRejectedByEmailApi(data) ? tr('login_phone_unavailable') : (data.message || tr('login_phone_fail')));
        }

        localStorage.setItem("token", data.token);
        if (data.user) localStorage.setItem("user", JSON.stringify(data.user));
        showToast(tr('login_phone_success'));
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (err) {
        showToast(err.message, true);
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });

    document.getElementById('btn-phone-otp').addEventListener('click', async function() {
      const phone = normalizePhone(document.getElementById('phone-reset-number').value);
      if (!phone) {
        showToast(tr('login_phone_need_number'), true);
        return;
      }

      const btn = this;
      const originalText = tr('login_phone_send_otp');
      btn.innerText = tr('login_phone_sending');
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, type: "password_reset" })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(phoneRejectedByEmailApi(data) ? tr('login_phone_sms_unavailable') : (data.message || tr('login_phone_otp_fail')));
        }

        showToast(tr('login_phone_otp_sent'));
        let count = 60;
        const timer = setInterval(() => {
          count--;
          btn.innerText = tr('login_phone_retry').replace('{n}', count);
          if (count <= 0) {
            clearInterval(timer);
            btn.innerText = originalText;
            btn.disabled = false;
          }
        }, 1000);
      } catch (err) {
        showToast(err.message, true);
        btn.innerText = originalText;
        btn.disabled = false;
      }
    });

    document.getElementById('form-phone-reset').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!checkPhoneMatch()) {
        showToast(tr('login_phone_mismatch'), true);
        return;
      }

      const phone = normalizePhone(document.getElementById('phone-reset-number').value);
      const otp = document.getElementById('phone-reset-otp').value.trim();
      const newPassword = masks['phone-new-password'];
      if (!phone) {
        showToast(tr('login_phone_need_number'), true);
        return;
      }
      if (!otp) {
        showToast(tr('login_phone_otp_need'), true);
        return;
      }
      if (!newPassword || newPassword.length < 8) {
        showToast(tr('login_phone_short_pw'), true);
        return;
      }

      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = tr('login_phone_resetting');
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, otp, newPassword })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(phoneRejectedByEmailApi(data) ? tr('login_phone_sms_unavailable') : (data.message || tr('login_phone_reset_fail')));
        }

        showToast(tr('login_phone_reset_success'));
        document.getElementById('phone-login-number').value = document.getElementById('phone-reset-number').value;
        openPhoneLogin();
      } catch (err) {
        showToast(err.message, true);
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });

    document.getElementById('form-phone-register').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!checkPhoneRegMatch()) {
        showToast(tr('login_phone_mismatch'), true);
        return;
      }

      const phone = normalizePhone(document.getElementById('phone-reg-number').value);
      const name = document.getElementById('phone-reg-name').value.trim();
      const password = masks['phone-reg-password'];
      if (!phone) {
        showToast(tr('login_phone_need_number'), true);
        return;
      }
      if (!name) {
        showToast(tr('login_phone_need_name'), true);
        return;
      }
      if (!password || password.length < 8) {
        showToast(tr('login_phone_short_pw'), true);
        return;
      }

      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = tr('login_phone_sending');
      submitBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, name, password, type: "registration" })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(phoneRejectedByEmailApi(data) ? tr('login_phone_reg_unavailable') : (data.message || tr('login_phone_otp_fail')));
        }
        showToast(tr('login_phone_otp_sent'));
      } catch (err) {
        showToast(err.message, true);
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
  <script src="chat.js"></script>
</body>
</html>
